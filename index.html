<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jet Engine Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>JET ENGINE SIMULATOR</h1>

    <div class="engine">

        <div class="section">
            <div class="blades" id="compressor">
                🌀
            </div>
            <p>COMPRESSOR</p>
        </div>

        <div class="section combustor">
            <div class="flame">🔥</div>
            <p>COMBUSTOR</p>
        </div>

        <div class="section">
            <div class="blades" id="turbine">
                🌀
            </div>
            <p>TURBINE</p>
        </div>

        <div class="exhaust">
            💨💨💨
            <p>EXHAUST</p>
        </div>

    </div>

    <div class="controls">
        <label for="throttle">Throttle</label>
        <input type="range" id="throttle" min="0" max="100" value="75">
        <span id="throttleValue">75%</span>
    </div>

    <div class="readouts">
        <p>RPM: <span id="rpm">0</span></p>
        <p>Pressure: <span id="pressure">0</span></p>
        <p>Temperature: <span id="temperature">0</span></p>
        <p>Thrust: <span id="thrust">0</span></p>
    </div>

    <script src="script.js"></script>

</body>
</html>
